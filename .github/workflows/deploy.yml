name: Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_PUBLIC_APP_ENV: ${{ vars.NEXT_PUBLIC_APP_ENV || secrets.NEXT_PUBLIC_APP_ENV }}
  NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || secrets.NEXT_PUBLIC_APP_URL }}
  NEXT_PUBLIC_VAPI_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPI_PUBLIC_KEY || secrets.NEXT_PUBLIC_VAPI_PUBLIC_KEY }}
  NEXT_PUBLIC_VAPI_ASSISTANT_ID: ${{ vars.NEXT_PUBLIC_VAPI_ASSISTANT_ID || secrets.NEXT_PUBLIC_VAPI_ASSISTANT_ID }}

jobs:
  build_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Restore build caches
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .next/cache
            tsconfig.tsbuildinfo
          key: ${{ runner.os }}-deploy-build-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig*.json', 'prisma/schema/**/*.prisma') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-deploy-build-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig*.json', 'prisma/schema/**/*.prisma') }}-

      - name: Install dependencies
        run: npm ci --include=dev --prefer-offline --no-audit --ignore-scripts

      - name: Prisma client generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/kollegan?schema=public
        run: npx prisma generate

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Package Next build artifact
        run: tar -czf kollegan-next-build.tar.gz .next

      - name: Package deploy bundle
        run: tar -czf kollegan-deploy-bundle.tar.gz kollegan-next-build.tar.gz scripts/deploy-release.sh

      - name: Upload deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle-${{ github.sha }}
          path: kollegan-deploy-bundle.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Save build caches
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .next/cache
            tsconfig.tsbuildinfo
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_release
    steps:
      - name: Download deploy bundle
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle-${{ github.sha }}
          path: .

      - name: Copy deploy bundle to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          source: kollegan-deploy-bundle.tar.gz
          target: /tmp/kollegan-release
          overwrite: true

      - name: Deploy artifact on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            set -euo pipefail
            mkdir -p /tmp/kollegan-release
            tar -xzf /tmp/kollegan-release/kollegan-deploy-bundle.tar.gz -C /tmp/kollegan-release
            chmod +x /tmp/kollegan-release/scripts/deploy-release.sh
            HEALTHCHECK_URLS="${{ secrets.DEPLOY_HEALTHCHECK_URLS }}" \
            bash /tmp/kollegan-release/scripts/deploy-release.sh /tmp/kollegan-release/kollegan-next-build.tar.gz ${{ github.sha }}
