name: Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            set -euo pipefail
            cd /var/www/offert
            git fetch origin
            git rebase --abort >/dev/null 2>&1 || true
            git reset --hard origin/main
            rm -f .next/lock
            npm ci --include=dev --no-audit
            npx playwright install chromium
            BEFORE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              if git rev-parse "${HEAD_SHA}^" >/dev/null 2>&1; then
                QUALITY_BASE_SHA="$(git rev-parse "${HEAD_SHA}^")" QUALITY_HEAD_SHA="$HEAD_SHA" npm run check:migrations
                QUALITY_BASE_SHA="$(git rev-parse "${HEAD_SHA}^")" QUALITY_HEAD_SHA="$HEAD_SHA" npm run check:file-size
              else
                npm run check:migrations:all
                npm run check:file-size:all
              fi
            else
              QUALITY_BASE_SHA="$BEFORE_SHA" QUALITY_HEAD_SHA="$HEAD_SHA" npm run check:migrations
              QUALITY_BASE_SHA="$BEFORE_SHA" QUALITY_HEAD_SHA="$HEAD_SHA" npm run check:file-size
            fi
            npm run check:ai-proxies
            npm run build
            npx prisma migrate deploy
            sudo systemctl restart kollegan
