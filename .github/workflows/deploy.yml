name: Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            set -euo pipefail
            cd /var/www/offert
            git fetch origin
            git rebase --abort >/dev/null 2>&1 || true
            git reset --hard origin/main
            rm -f .next/lock
            npm ci --include=dev --prefer-offline --no-audit
            BEFORE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              if git rev-parse "${HEAD_SHA}^" >/dev/null 2>&1; then
                QUALITY_BASE_SHA="$(git rev-parse "${HEAD_SHA}^")" QUALITY_HEAD_SHA="$HEAD_SHA" npm run check:migrations
              else
                npm run check:migrations:all
              fi
            else
              QUALITY_BASE_SHA="$BEFORE_SHA" QUALITY_HEAD_SHA="$HEAD_SHA" npm run check:migrations
            fi
            npm run build
            npx prisma migrate deploy
            sudo systemctl restart kollegan
            health_urls=(
              "http://127.0.0.1:3000/api/health"
              "http://localhost:3000/api/health"
              "http://127.0.0.1/api/health"
              "http://localhost/api/health"
            )
            for url in "${health_urls[@]}"; do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                exit 0
              fi
            done
            echo "Health check failed on all known local endpoints" >&2
            exit 1
