name: Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --prefer-offline --no-audit --ignore-scripts

      - name: Prisma client generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/kollegan?schema=public
        run: npx prisma generate

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Package Next build artifact
        run: tar -czf kollegan-next-build.tar.gz .next

      - name: Upload Next build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: kollegan-next-build.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_release
    steps:
      - name: Download Next build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: release

      - name: Copy build artifact to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          source: release/kollegan-next-build.tar.gz
          target: /tmp
          overwrite: true

      - name: Deploy artifact on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            set -euo pipefail
            cd /var/www/offert
            bash scripts/deploy-release.sh /tmp/release/kollegan-next-build.tar.gz
