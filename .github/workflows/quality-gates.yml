name: Quality Gates

on:
  pull_request:
    branches:
      - main

concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Restore lint cache
        uses: actions/cache@v4
        with:
          path: .next/cache/eslint
          key: ${{ runner.os }}-lint-${{ hashFiles('package-lock.json') }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lint-${{ hashFiles('package-lock.json') }}-${{ github.ref_name }}-
            ${{ runner.os }}-lint-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prisma client generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/kollegan?schema=public
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Migration safety
        run: npm run check:migrations

      - name: AI proxy consistency
        run: npm run check:ai-proxies

      - name: Dependency boundaries
        run: npm run lint:deps
      - name: Text encoding guard
        run: npm run check:encoding

      - name: File-size guard
        run: npm run check:file-size

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            tsconfig.tsbuildinfo
          key: ${{ runner.os }}-build-${{ hashFiles('package-lock.json') }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('package-lock.json') }}-${{ github.ref_name }}-
            ${{ runner.os }}-build-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prisma client generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/kollegan?schema=public
        run: npx prisma generate

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run typecheck

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

  safety:
    runs-on: ubuntu-latest
    needs:
      - quality
      - build
    if: always()
    steps:
      - name: Require quality and build jobs to pass
        run: |
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
