name: Quality Gates

on:
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      runtime_affecting: ${{ steps.classify.outputs.runtime_affecting }}
      process_affecting: ${{ steps.classify.outputs.process_affecting }}
      process_only: ${{ steps.classify.outputs.process_only }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      unknown_files: ${{ steps.classify.outputs.unknown_files }}
      changed_files_json: ${{ steps.classify.outputs.changed_files_json }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          mapfile -t changed_files < <(git diff --name-only --diff-filter=ACMRD "$base_sha" "$head_sha")

          runtime=false
          process=false
          docs_only=true
          unknown=false

          for file in "${changed_files[@]}"; do
            [ -n "$file" ] || continue
            matched=false

            case "$file" in
              src/*|prisma/*|public/*|package.json|package-lock.json|next.config.*|tsconfig*.json|middleware.ts|instrumentation.ts|eslint.config.*|vitest.config.*|postcss.config.*|tailwind.config.*)
                runtime=true
                docs_only=false
                matched=true
                ;;
            esac

            case "$file" in
              .github/workflows/*|scripts/deploy-release.sh|scripts/check-*.mjs|scripts/codebase-inventory.mjs)
                process=true
                docs_only=false
                matched=true
                ;;
            esac

            case "$file" in
              docs/*|AGENTS.md|CLAUDE.md|.github/copilot-instructions.md|.claude/skills/*)
                matched=true
                ;;
            esac

            if [ "$matched" = false ]; then
              runtime=true
              docs_only=false
              unknown=true
            fi
          done

          if [ "${#changed_files[@]}" -eq 0 ]; then
            docs_only=false
          fi

          process_only=false
          if [ "$process" = true ] && [ "$runtime" = false ]; then
            process_only=true
          fi

          changed_files_json="$(printf '%s\n' "${changed_files[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')"

          {
            echo "runtime_affecting=$runtime"
            echo "process_affecting=$process"
            echo "process_only=$process_only"
            echo "docs_only=$docs_only"
            echo "unknown_files=$unknown"
            echo "changed_files_json=$changed_files_json"
          } >> "$GITHUB_OUTPUT"

  lightweight_safety:
    runs-on: ubuntu-latest
    needs:
      - classify
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Migration safety
        run: node scripts/check-migration-safety.mjs

      - name: AI proxy consistency
        run: node scripts/check-ai-proxies.mjs

      - name: Security evidence guard
        run: node scripts/check-security-evidence.mjs

      - name: Security readiness status
        run: node scripts/check-security-readiness.mjs

      - name: Legacy API literal guard
        run: node scripts/check-legacy-api-literals.mjs

      - name: Text encoding guard
        run: node scripts/check-text-encoding.mjs

      - name: File-size guard
        run: node scripts/check-file-size.mjs

  process_validation:
    runs-on: ubuntu-latest
    needs:
      - classify
    steps:
      - name: Skip targeted process validation
        if: needs.classify.outputs.process_affecting != 'true'
        run: echo "No process-affecting changes detected."

      - uses: actions/checkout@v5
        if: needs.classify.outputs.process_affecting == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        if: needs.classify.outputs.process_affecting == 'true'
        with:
          node-version: 24

      - name: Install actionlint
        if: needs.classify.outputs.process_affecting == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download -R rhysd/actionlint --pattern 'actionlint_1.7.12_linux_amd64.tar.gz' --output /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          chmod +x /tmp/actionlint

      - name: Validate workflow files
        if: needs.classify.outputs.process_affecting == 'true'
        run: /tmp/actionlint .github/workflows/quality-gates.yml .github/workflows/deploy.yml

      - name: Validate deploy shell syntax
        if: needs.classify.outputs.process_affecting == 'true'
        run: bash -n scripts/deploy-release.sh

      - name: Run targeted process validations
        if: needs.classify.outputs.process_affecting == 'true'
        shell: bash
        env:
          CHANGED_FILES_JSON: ${{ needs.classify.outputs.changed_files_json }}
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          mapfile -t changed_files < <(jq -r '.[]' <<< "$CHANGED_FILES_JSON")
          ran_policy_script=false

          for file in "${changed_files[@]}"; do
            case "$file" in
              scripts/check-ai-proxies.mjs)
                node scripts/check-ai-proxies.mjs
                ran_policy_script=true
                ;;
              scripts/check-security-evidence.mjs)
                QUALITY_BASE_SHA="$QUALITY_BASE_SHA" QUALITY_HEAD_SHA="$QUALITY_HEAD_SHA" node scripts/check-security-evidence.mjs
                ran_policy_script=true
                ;;
              scripts/check-migration-safety.mjs)
                QUALITY_BASE_SHA="$QUALITY_BASE_SHA" QUALITY_HEAD_SHA="$QUALITY_HEAD_SHA" node scripts/check-migration-safety.mjs
                ran_policy_script=true
                ;;
              scripts/check-text-encoding.mjs)
                QUALITY_BASE_SHA="$QUALITY_BASE_SHA" QUALITY_HEAD_SHA="$QUALITY_HEAD_SHA" node scripts/check-text-encoding.mjs
                ran_policy_script=true
                ;;
              scripts/check-file-size.mjs)
                QUALITY_BASE_SHA="$QUALITY_BASE_SHA" QUALITY_HEAD_SHA="$QUALITY_HEAD_SHA" node scripts/check-file-size.mjs
                ran_policy_script=true
                ;;
              scripts/check-security-readiness.mjs)
                node scripts/check-security-readiness.mjs
                ran_policy_script=true
                ;;
              scripts/check-legacy-api-literals.mjs)
                node scripts/check-legacy-api-literals.mjs
                ran_policy_script=true
                ;;
              scripts/codebase-inventory.mjs)
                node scripts/codebase-inventory.mjs >/dev/null
                ran_policy_script=true
                ;;
            esac
          done

          if [ "$ran_policy_script" = false ]; then
            echo "No repo policy scripts changed."
          fi

      - name: Validate patch formatting
        if: needs.classify.outputs.process_affecting == 'true'
        run: git diff --check

  quality:
    runs-on: ubuntu-latest
    needs:
      - classify
    steps:
      - name: Skip full quality lane
        if: needs.classify.outputs.runtime_affecting != 'true'
        run: echo "Skipping lint, tests, typecheck, and dependency boundaries because no runtime-affecting files changed."

      - uses: actions/checkout@v5
        if: needs.classify.outputs.runtime_affecting == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        if: needs.classify.outputs.runtime_affecting == 'true'
        with:
          node-version: 24

      - name: Restore npm cache
        if: needs.classify.outputs.runtime_affecting == 'true'
        id: npm-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - name: Restore lint cache
        if: needs.classify.outputs.runtime_affecting == 'true'
        id: lint-cache
        uses: actions/cache/restore@v4
        with:
          path: .next/cache/eslint
          key: ${{ runner.os }}-lint-${{ hashFiles('package-lock.json', 'eslint.config.*', '.eslintrc*', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lint-${{ hashFiles('package-lock.json', 'eslint.config.*', '.eslintrc*', 'tsconfig*.json') }}-

      - name: Install dependencies
        if: needs.classify.outputs.runtime_affecting == 'true'
        run: npm ci --ignore-scripts

      - name: Prisma client generate
        if: needs.classify.outputs.runtime_affecting == 'true'
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/kollegan?schema=public
        run: npx prisma generate

      - name: Lint
        if: needs.classify.outputs.runtime_affecting == 'true'
        run: npm run lint

      - name: Unit tests
        if: needs.classify.outputs.runtime_affecting == 'true'
        run: npm test

      - name: Typecheck
        if: needs.classify.outputs.runtime_affecting == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run typecheck

      - name: Dependency boundaries
        if: needs.classify.outputs.runtime_affecting == 'true'
        run: npm run lint:deps

  build:
    runs-on: ubuntu-latest
    needs:
      - classify
    steps:
      - name: Skip full build lane
        if: needs.classify.outputs.runtime_affecting != 'true'
        run: echo "Skipping full app build because no runtime-affecting files changed."

      - uses: actions/checkout@v5
        if: needs.classify.outputs.runtime_affecting == 'true'
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        if: needs.classify.outputs.runtime_affecting == 'true'
        with:
          node-version: 24

      - name: Restore npm cache
        if: needs.classify.outputs.runtime_affecting == 'true'
        id: npm-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - name: Restore build caches
        if: needs.classify.outputs.runtime_affecting == 'true'
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .next/cache
            tsconfig.tsbuildinfo
          key: ${{ runner.os }}-build-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig*.json', 'prisma/schema/**/*.prisma') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig*.json', 'prisma/schema/**/*.prisma') }}-

      - name: Install dependencies
        if: needs.classify.outputs.runtime_affecting == 'true'
        run: npm ci --ignore-scripts

      - name: Prisma client generate
        if: needs.classify.outputs.runtime_affecting == 'true'
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/kollegan?schema=public
        run: npx prisma generate

      - name: Build
        if: needs.classify.outputs.runtime_affecting == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Package Next build artifact
        if: needs.classify.outputs.runtime_affecting == 'true'
        run: tar -czf kollegan-next-build.tar.gz .next

      - name: Write release metadata
        if: needs.classify.outputs.runtime_affecting == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          build_commit_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"

          BUILD_COMMIT_SHA="$build_commit_sha" \
          TREE_SHA="$tree_sha" \
          node <<'NODE'
          const fs = require('node:fs');

          const data = {
            bundle_version: 1,
            source: 'pull_request',
            event_name: process.env.GITHUB_EVENT_NAME,
            pr_number: Number(process.env.PR_NUMBER),
            run_id: Number(process.env.GITHUB_RUN_ID),
            run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            build_commit_sha: process.env.BUILD_COMMIT_SHA,
            tree_sha: process.env.TREE_SHA,
            base_ref: process.env.PR_BASE_REF,
            base_sha: process.env.PR_BASE_SHA,
            head_ref: process.env.PR_HEAD_REF,
            head_sha: process.env.PR_HEAD_SHA,
            created_at: new Date().toISOString(),
          };

          fs.writeFileSync('release-metadata.json', JSON.stringify(data, null, 2));
          NODE

      - name: Package PR release bundle
        if: needs.classify.outputs.runtime_affecting == 'true'
        run: tar -czf pr-release-bundle-${{ github.run_id }}.tar.gz kollegan-next-build.tar.gz release-metadata.json scripts/deploy-release.sh

      - name: Upload PR release bundle
        if: needs.classify.outputs.runtime_affecting == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr-release-bundle
          path: pr-release-bundle-${{ github.run_id }}.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Save build caches
        if: needs.classify.outputs.runtime_affecting == 'true' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .next/cache
            tsconfig.tsbuildinfo
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  safety:
    runs-on: ubuntu-latest
    needs:
      - classify
      - lightweight_safety
      - process_validation
      - quality
      - build
    if: always()
    steps:
      - name: Require the expected lanes to pass
        run: |
          test "${{ needs.classify.result }}" = "success"
          test "${{ needs.lightweight_safety.result }}" = "success"
          test "${{ needs.process_validation.result }}" = "success"
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
