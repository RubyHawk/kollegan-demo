name: Quality Gates

on:
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - name: Restore lint cache
        id: lint-cache
        uses: actions/cache/restore@v4
        with:
          path: .next/cache/eslint
          key: ${{ runner.os }}-lint-${{ hashFiles('package-lock.json', 'eslint.config.*', '.eslintrc*', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lint-${{ hashFiles('package-lock.json', 'eslint.config.*', '.eslintrc*', 'tsconfig*.json') }}-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prisma client generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/kollegan?schema=public
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run typecheck

      - name: Migration safety
        run: npm run check:migrations

      - name: AI proxy consistency
        run: npm run check:ai-proxies

      - name: Dependency boundaries
        run: npm run lint:deps
      - name: Text encoding guard
        run: npm run check:encoding

      - name: File-size guard
        run: npm run check:file-size

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - name: Restore build caches
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .next/cache
            tsconfig.tsbuildinfo
          key: ${{ runner.os }}-build-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig*.json', 'prisma/schema/**/*.prisma') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig*.json', 'prisma/schema/**/*.prisma') }}-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prisma client generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/kollegan?schema=public
        run: npx prisma generate

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

  safety:
    runs-on: ubuntu-latest
    needs:
      - quality
      - build
    if: always()
    steps:
      - name: Require quality and build jobs to pass
        run: |
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
